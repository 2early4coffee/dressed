{% extends "layout.html" %}

{% block title %}{{ code }} {{ title }}{% endblock %}
{% block meta_description %}{{ message }}{% endblock %}

{% block extra_head %}
<style>
    .error-page {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--sp-8) var(--sp-4);
    }

    .error-box {
        text-align: center;
        max-width: 480px;
        width: 100%;
    }

    .error-code {
        font-size: 6rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--border);
        margin-bottom: var(--sp-4);
        font-variant-numeric: tabular-nums;
    }

    .error-icon {
        font-size: 2.5rem;
        color: var(--text-muted);
        margin-bottom: var(--sp-3);
        display: block;
    }

    .error-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: var(--sp-2);
    }

    .error-message {
        font-size: 0.9rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: var(--sp-7);
    }

    .error-actions {
        display: flex;
        gap: var(--sp-3);
        justify-content: center;
        flex-wrap: wrap;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box">
        <span class="error-code">{{ code }}</span>
        <i class="ti {{ icon }} error-icon" aria-hidden="true"></i>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-message">{{ message }}</p>
        <div class="error-actions">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                <i class="ti ti-home" aria-hidden="true"></i> Go home
            </a>
            {% if show_back %}
            <button onclick="history.back()" class="btn btn-ghost">
                <i class="ti ti-arrow-left" aria-hidden="true"></i> Go back
            </button>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
